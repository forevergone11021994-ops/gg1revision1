@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--veil:#1d2036b3}}
:root[data-theme="dark"]{--veil:#1d2036b3}
body{margin:0;background:linear-gradient(var(--veil),var(--veil)),var(--bgimg) center/cover no-repeat,var(--bg1);background-attachment:fixed;color:var(--ink);font-family:var(--fb);font-size:18px;line-height:1.5;min-height:100%;
padding:10px max(14px,env(safe-area-inset-right,0px)) 110px max(14px,env(safe-area-inset-left,0px))}
.app{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:4px 0 8px}
.top h1{font-size:clamp(18px,4.6vw,24px);color:var(--pink)}
.tools{display:flex;gap:8px;align-items:center}
.stars{background:var(--sun-soft);color:var(--sun);border-radius:99px;padding:2px 14px;font-weight:800;font-size:16px;white-space:nowrap}
.ib{border:0;background:var(--card);border-radius:99px;width:42px;height:42px;box-shadow:var(--shadow);font-size:20px}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.dot{border:2px solid var(--pink-soft);background:var(--card);border-radius:99px;min-width:38px;height:38px;font-weight:800;font-size:15px;padding:0 8px}
.dot[aria-current="page"]{background:var(--pink);color:var(--on-pink);border-color:var(--pink)}
.dot.ok{border-color:var(--mint);background:var(--mint-soft)}
.dot.ok[aria-current="page"]{background:var(--mint);color:var(--card)}
.card{background:color-mix(in srgb,var(--card) 94%,transparent);border:2px solid var(--line);border-radius:30px;padding:18px;box-shadow:var(--shadow);min-width:0}
.hd{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tag{background:var(--pink-soft);color:var(--ink);border-radius:99px;padding:2px 14px;font-family:var(--fd);font-weight:700;font-size:15px}
.hd h2{font-size:clamp(20px,5vw,28px)}
.ins{background:var(--sun-soft);border-radius:18px;padding:8px 14px;margin-bottom:14px;font-weight:600}
.layout{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:640px){.layout.side{grid-template-columns:1fr 210px;align-items:start}}
.pic{width:100%;max-width:220px;border-radius:24px;margin:0 auto;display:block;border:2px solid var(--line)}
.pic.sm{max-width:180px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.list li{display:flex;gap:12px;align-items:baseline;background:var(--soft);border-radius:20px;padding:10px 12px;min-width:0}
.num{flex:none;width:32px;height:32px;border-radius:50%;background:var(--pink-soft);display:grid;place-items:center;font-weight:800;font-size:15px;align-self:center}
.tx{min-width:0;overflow-wrap:anywhere}
.ex{text-decoration:underline;font-style:italic;color:var(--blue);font-weight:700}
.list li.exr .num{background:var(--lilac)}
input.ans{font:inherit;color:var(--ink);background:var(--card);border:0;border-bottom:3px solid var(--pink);border-radius:8px 8px 0 0;padding:0 6px;width:7.5em;max-width:100%;text-align:center}
input.ans.wide{width:6em}
.pfx{font-weight:800;color:var(--pink)}
.opts{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}
.o{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:0 12px;font-weight:800;font-style:italic}
.o[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.bad{background:var(--red-soft)!important}.good{background:var(--mint-soft)!important}
input.ans.good{border-bottom-color:var(--mint)}input.ans.bad{border-bottom-color:var(--red)}
.o.good{border-color:var(--mint)}.o.bad{border-color:var(--red)}
.bank{display:flex;flex-wrap:wrap;gap:8px;background:var(--blue-soft);border:2px dashed var(--blue);border-radius:20px;padding:10px;margin-bottom:14px;min-height:56px}
.chip{border:0;background:var(--card);border-radius:99px;padding:2px 16px;font-weight:800;box-shadow:0 3px 0 var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.chip.sel{background:var(--pink);color:var(--on-pink)}
.gap{display:inline-block;min-width:6.2em;height:1.5em;border-bottom:3px dashed var(--pink);border-radius:8px 8px 0 0;vertical-align:-4px;text-align:center;font-weight:800;color:var(--blue);padding:0 6px;cursor:pointer;background:var(--card)}
.gap:empty::before{content:attr(data-n);color:var(--muted);font-weight:600}
.gap .chip{padding:0 4px;box-shadow:none;background:transparent;color:inherit;font-weight:800}
.gap.hot{background:var(--sun-soft)}
.gap.good{background:var(--mint-soft);border-bottom-style:solid;border-bottom-color:var(--mint)}
.gap.bad{background:var(--red-soft);border-bottom-style:solid;border-bottom-color:var(--red)}
.note{background:var(--soft);border:2px solid var(--line);border-radius:22px;padding:14px 16px;line-height:2.1}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%);background:var(--pink);color:var(--on-pink);border-radius:99px;padding:2px 16px;font-weight:800;box-shadow:var(--shadow)}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.btn{border:0;border-radius:99px;padding:10px 22px;font-weight:800;background:var(--pink);color:var(--on-pink);box-shadow:0 4px 0 color-mix(in srgb,var(--pink) 65%,#000)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.alt{background:var(--lilac);color:var(--ink);box-shadow:0 4px 0 color-mix(in srgb,var(--lilac) 70%,#000)}
.res{font-weight:800;font-family:var(--fd)}
.res.win{color:var(--mint)}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:12px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg2) 40%)}
.nav .btn{min-width:130px}
.nav .btn:disabled{opacity:.4;box-shadow:none}
.qcard{background:var(--lilac);border-radius:28px;padding:24px 18px;text-align:center;display:grid;gap:12px;min-height:190px;align-content:center}
.qcard .q{font-family:var(--fd);font-size:clamp(22px,6vw,32px);font-weight:700;text-wrap:balance}
.qcard .em{font-size:48px;line-height:1}
.help{background:var(--mint-soft);border-radius:16px;padding:6px 14px;font-style:italic}
.cnt{color:var(--muted);font-weight:700}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.fc{perspective:700px;border:0;background:none;padding:0;height:180px;min-width:0}
.fc .in{display:block;position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc[aria-pressed="true"] .in{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;align-content:center;gap:4px;padding:10px;text-align:center;border:2px solid var(--line)}
.fc .f{background:var(--soft)}.fc .f .em{display:block;font-size:44px;line-height:1.1}.fc .f b{font-family:var(--fd);font-size:16px}
.fc .b{background:var(--mint-soft);transform:rotateY(180deg);font-weight:700;font-size:16px;line-height:1.35}
@media (prefers-reduced-motion:reduce){.fc .in{transition:none}}
.msg{background:var(--sun-soft);border-radius:14px;padding:6px 12px;font-size:15px;margin-bottom:8px}
</style>

{id:'sq',tag:'🗣️',title:'Speaking: questions',kind:'sq'},
{id:'sc',tag:'🗣️',title:'Speaking: cards',kind:'sc'}];
const Q=[['Where are you from?',"I'm from …",'🌍'],['What nationality are you?',"I'm …",'🏳️'],['Who is in your family?','I have a mum, a dad, …','👨‍👩‍👧'],['Do you have a brother or a sister?',"Yes, I do. / No, I don't.",'👦'],['Who is your best friend?','My best friend is …','🤝'],['Where are you now?',"I'm at home. / I'm in my room.",'🏠'],['Where is your dad today?',"He's at work. / He's at home.",'👨'],['Are you at school today?',"Yes, I am. / No, I'm not. I'm at home.",'🏫'],['What is your favourite place?','My favourite place is …','🌳'],['Is your friend at home now?',"Yes, he/she is. / No, he/she isn't.",'🏡']];
const C=[['🇫🇷','Claude',"Claude is from France. He's French."],['🇨🇳','Li and Chen',"They're from China. They're Chinese."],['🇵🇱','Dorota',"Dorota is from Poland. She's Polish."],['🇺🇸','You',"You're from the USA. You're American."],['🇮🇹','Carlo',"Carlo is from Italy. He's Italian."],['👵👴','Rose and Adam','Rose is my grandmother. Adam is my grandfather.'],['🏖️',"Alice's sister","She isn't here. She's on holiday."],['🎉','My friends',"My friends are at a party."],['🏫','You',"You aren't at school today."],['🐕🌳','The dog','The dog is in the garden.']];
let cur=0,score={},qi=0;
const $=id=>document.getElementById(id);
function wire(root){
  const bank=root.querySelector('.bank');
  if(bank){
    let sel=null,drag=null;
    const put=(chip,gap)=>{const src=chip.parentElement;if(src&&src.classList&&src.classList.contains('gap'))src.dataset.w='';const old=gap.firstElementChild;if(old)back(old);gap.textContent='';gap.appendChild(chip);chip.classList.remove('sel');chip.style.cssText='';gap.dataset.w=chip.dataset.w;sel=null;root.querySelectorAll('.gap').forEach(g=>g.classList.remove('good','bad'));};
    const back=chip=>{bank.appendChild(chip);chip.classList.remove('sel')};
    root.addEventListener('pointerdown',e=>{
      const chip=e.target.closest('.chip');if(!chip)return;
      drag={chip,x:e.clientX,y:e.clientY,on:false,g:null};
    });
    window.addEventListener('pointermove',e=>{
      if(!drag)return;
      if(!drag.on&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.on=true;drag.g=document.createElement('div');drag.g.className='ghost';drag.g.textContent=drag.chip.dataset.w;document.body.appendChild(drag.g)}
      if(drag.on){drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';const t=document.elementFromPoint(e.clientX,e.clientY);root.querySelectorAll('.gap').forEach(g=>g.classList.toggle('hot',g===(t&&t.closest('.gap'))))}
    });
    window.addEventListener('pointerup',e=>{
      if(!drag)return;const d=drag;drag=null;
      root.querySelectorAll('.gap').forEach(g=>g.classList.remove('hot'));
      if(d.on){d.g.remove();const t=document.elementFromPoint(e.clientX,e.clientY),g=t&&t.closest('.gap');if(g&&root.contains(g))put(d.chip,g)}
      else{const was=d.chip.classList.contains('sel');if(sel)sel.classList.remove('sel');if(d.chip.parentElement===bank){sel=was?null:d.chip;if(sel)sel.classList.add('sel')}}
    });
    root.addEventListener('click',e=>{
      const g=e.target.closest('.gap');if(!g)return;
      if(sel){put(sel,g)}else if(g.firstElementChild){back(g.firstElementChild);g.dataset.w='';g.classList.remove('good','bad')}
    });
  }
  root.querySelectorAll('.opts').forEach(o=>o.addEventListener('click',e=>{const b=e.target.closest('.o');if(!b)return;o.querySelectorAll('.o').forEach(x=>{x.setAttribute('aria-pressed',x===b);x.classList.remove('good','bad')})}));
}
function render(){
  const p=P[cur],el=$('page');let h='';
  $('prev').disabled=cur===0;$('next').disabled=cur===P.length-1;
  if(p.kind==='sq'){h=`<div class="hd"><span class="tag">${p.tag}</span><h2>${p.title}</h2></div><p class="ins">Read the question and answer in English. Tap the card for a hint.</p>
   <div class="qcard" id="qc"></div><div class="acts"><button class="btn alt" id="qp">← Previous</button><button class="btn" id="qn">Next question 🎲</button><span class="cnt" id="qcnt"></span></div>`;el.innerHTML=h;qshow(false);
   $('qp').onclick=()=>{qi=(qi+Q.length-1)%Q.length;qshow(false)};$('qn').onclick=()=>{qi=(qi+1)%Q.length;qshow(false)};return}
  if(p.kind==='sc'){h=`<div class="hd"><span class="tag">${p.tag}</span><h2>${p.title}</h2></div><p class="ins">Look at the card and say a sentence. Tap the card to check.</p><div class="cards">${C.map((c,i)=>`<button type="button" class="fc" aria-pressed="false" aria-label="Card ${i+1}"><span class="in"><span class="f"><span class="em">${c[0]}</span><b>${c[1]}</b></span><span class="b">${esc(c[2])}</span></span></button>`).join('')}</div>
   <div class="acts"><button class="btn alt" id="fl">Turn all back</button></div>`;el.innerHTML=h;
   el.querySelectorAll('.fc').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'));$('fl').onclick=()=>el.querySelectorAll('.fc').forEach(b=>b.setAttribute('aria-pressed','false'));return}
  let body='',n=0;
  if(p.kind==='fill'||p.kind==='choice'||p.kind==='write'){
    body='<ol class="list" style="padding:0">'+p.items.map((it,i)=>{
      const num=it.ex?0:++n;let inner;
      if(p.kind==='fill')inner=it.ex?`${esc(it.pre)}<span class="ex">${it.ex}</span>${it.post}`:`${esc(it.pre)}<span class="pfx">${it.p}</span>${IN([it.a,it.p+it.a])}${it.post}`;
      if(p.kind==='choice')inner=`${esc(it.pre)} <span class="opts" data-a="${it.a}">${it.o.map(o=>it.ex?`<span class="o" ${o===it.a?'style="background:var(--blue-soft);border-color:var(--blue)"':''}>${o}</span>`:`<button type="button" class="o" aria-pressed="false">${o}</button>`).join('')}</span> ${esc(it.post)}`;
      if(p.kind==='write')inner=it.ex?`${esc(it.pre)} <span class="ex">${it.a}</span> ${esc(it.post)}`:`${esc(it.pre)} ${IN(it.a)} ${esc(it.post)}`;
      return `<li class="${it.ex?'exr':''}"><span class="num">${num}</span><span class="tx">${inner}</span></li>`}).join('')+'</ol>';
  }
  if(p.kind==='gap'){
    body=`<div class="bank" aria-label="Words">${p.bank.map(w=>`<button type="button" class="chip" data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div>`;
    const mk=t=>t.replace(/\{\{(.+?)\}\}/g,(m,a)=>`<span class="gap" data-a="${esc(a)}" data-n="${++n}"></span>`);
    if(p.list)body+='<ol class="list" style="padding:0">'+p.text.map((t,i)=>{const ex=t.endsWith('|ex');return `<li class="${ex?'exr':''}"><span class="num">${ex?0:i}</span><span class="tx">${mk(ex?t.slice(0,-3):t)}</span></li>`}).join('')+'</ol>';
    else body+=`<div class="note">${p.text.map(t=>`<div>${mk(t)}</div>`).join('')}</div>`;
  }
  const pic=p.img?`<img class="pic${p.wide?'':' sm'}" src="${IMG[p.img]}" alt="">`:'';
  h=`<div class="hd"><span class="tag">${p.tag}</span><h2>${p.title}</h2></div><p class="ins">${p.ins}</p>
  <div class="layout${p.img&&!p.wide?' side':''}"><div>${body}</div>${p.wide?'':pic}</div>${p.wide?`<div style="margin-top:14px">${pic}</div>`:''}
  <div class="acts"><button class="btn" id="chk">Check ✓</button><button class="btn alt" id="shw">Show answers</button><button class="btn alt" id="rst">Try again</button><span class="res" id="res" role="status"></span></div>`;
  el.innerHTML=h;wire(el);
  if(p.wide){const im=el.querySelector('.pic');im.style.maxWidth='380px'}
  $('chk').onclick=check;$('shw').onclick=show;$('rst').onclick=()=>{score[p.id]=false;render();dots()};
}
function items(){const el=$('page'),r=[];
  el.querySelectorAll('input.ans').forEach(i=>r.push({el:i,ok:i.dataset.a.split('|').some(a=>N(i.value)===N(a))}));
  el.querySelectorAll('.opts[data-a]').forEach(o=>{const b=o.querySelector('.o[aria-pressed="true"]');r.push({el:b||o,ok:!!b&&b.textContent===o.dataset.a,box:o})});
  el.querySelectorAll('.gap').forEach(g=>r.push({el:g,ok:N(g.dataset.w||'')===N(g.dataset.a)}));
  return r}
function check(){
  const r=items(),p=P[cur];let ok=0;
  r.forEach(x=>{x.el.classList.remove('good','bad');x.el.classList.add(x.ok?'good':'bad');if(x.box&&!x.el.classList.contains('o'))x.box.querySelectorAll('.o').forEach(o=>o.classList.add('bad'));if(x.ok)ok++});
  const all=ok===r.length;score[p.id]=all;
  $('res').className='res'+(all?' win':'');$('res').textContent=all?`${ok}/${r.length} Great job! 🎉`:`${ok}/${r.length}. Fix the red ones and check again 💪`;
  dots();
}
function show(){
  const el=$('page');
  el.querySelectorAll('input.ans').forEach(i=>{i.value=i.dataset.a.split('|')[0]});
  el.querySelectorAll('.opts[data-a]').forEach(o=>o.querySelectorAll('.o').forEach(b=>b.setAttribute('aria-pressed',b.textContent===o.dataset.a)));
  const bank=el.querySelector('.bank');
  if(bank){el.querySelectorAll('.gap').forEach(g=>{const old=g.firstElementChild;if(old)bank.appendChild(old)});
    el.querySelectorAll('.gap').forEach(g=>{const c=[...bank.querySelectorAll('.chip')].find(c=>N(c.dataset.w)===N(g.dataset.a));g.textContent='';if(c){c.classList.remove('sel');g.appendChild(c)}g.dataset.w=g.dataset.a})}
  check();score[P[cur].id]=false;dots();$('res').textContent='Answers shown. Press Try again and do it yourself 😉';$('res').className='res';
}
function qshow(open){
  const q=Q[qi];$('qc').innerHTML=`<span class="em">${q[2]}</span><span class="q">${q[0]}</span>${open?`<span class="help">${esc(q[1])}</span>`:'<span class="cnt">Tap for a hint</span>'}`;
  $('qcnt').textContent=`${qi+1}/${Q.length}`;$('qc').onclick=()=>qshow(!open);
}
function dots(){
  $('dots').innerHTML=P.map((p,i)=>`<button type="button" class="dot${score[p.id]?' ok':''}" ${i===cur?'aria-current="page"':''} data-i="${i}" aria-label="${esc(p.title)}">${i+1}${score[p.id]?' ✓':''}</button>`).join('');
  $('stars').textContent='⭐ '+P.filter(p=>score[p.id]).length+'/6';
}
$('dots').onclick=e=>{const b=e.target.closest('.dot');if(b){cur=+b.dataset.i;go()}};
$('prev').onclick=()=>{if(cur>0){cur--;go()}};$('next').onclick=()=>{if(cur<P.length-1){cur++;go()}};
function go(){render();dots();window.scrollTo(0,0)}
$('fs').onclick=()=>{
  const d=document,e=d.documentElement;
  if(d.fullscreenElement){d.exitFullscreen();return}
  try{const r=e.requestFullscreen&&e.requestFullscreen();if(r&&r.catch)r.catch(()=>{$('fsmsg').hidden=false})}catch(x){$('fsmsg').hidden=false}
  if(!e.requestFullscreen)$('fsmsg').hidden=false;
};
go();
</script>
